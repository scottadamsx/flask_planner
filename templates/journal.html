{% extends 'template.html' %}

{% block content %}
<div class="module-header">
    <div>
        <h1><i class="fa-solid fa-book text-accent"></i> Journal</h1>
        <p>Capture your thoughts, one day at a time.</p>
    </div>
    <button type="button" id="newJournalEntry" class="btn"><i class="fa-solid fa-plus"></i> New Entry</button>
</div>

<form id="form" class="hidden-form">
    <div class="db-card form-card">
        <h3 class="form-card-title">New Journal Entry</h3>
        <div class="form-group">
            <label for="name">Title</label>
            <input type="text" id="name" placeholder="Give your entry a title...">
        </div>
        <div class="form-group">
            <label for="entry">Thoughts</label>
            <textarea id="entry" placeholder="Write your thoughts..." rows="5"></textarea>
        </div>
        <div class="form-actions">
            <button type="button" id="addEntry" class="btn"><i class="fa-solid fa-check"></i> Save Entry</button>
            <button type="button" id="cancelEntry" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
</form>

<section id="entries-section">
    <h2 class="section-heading">Previous Entries</h2>
    <div id="entries-list" class="journal-grid"></div>
</section>

<script src="{{ url_for('static', filename='journal.js')}}" type="module"></script>
{% endblock %}
