{% extends 'template.html' %}
{% block content %}
<div class="module-header">
    <div>
        <h1><i class="fa-solid fa-calendar-days text-primary"></i> Calendar</h1>
        <p>Plan your days and spot upcoming events.</p>
    </div>
    <button type="button" id="addEventBtn" class="btn"><i class="fa-solid fa-plus"></i> New Event</button>
</div>

<div id="calendar-controls" class="db-card calendar-controls">
    <button type="button" class="btn btn-secondary btn-sm" id="prevMonth" title="Previous month">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <h2 id="monthLabel" class="calendar-month-label">Month Year</h2>
    <button type="button" class="btn btn-secondary btn-sm" id="nextMonth" title="Next month">
        <i class="fa-solid fa-chevron-right"></i>
    </button>
</div>

<div id="calendar-grid" class="db-card calendar-grid-card"></div>

<div id="event-form-overlay" class="event-overlay-hidden">
    <div id="event-form-card">
        <h3><i class="fa-solid fa-calendar-plus text-primary"></i> Add Event</h3>
        <p class="event-overlay-date">Date: <span id="selectedDate" class="event-overlay-date-value"></span></p>
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="eventTitle" placeholder="What's happening?">
        </div>
        <div class="form-group">
            <label>Description (optional)</label>
            <textarea id="eventDescription" placeholder="Add more details..." rows="3"></textarea>
        </div>
        <div class="form-actions">
            <button type="button" id="saveEvent" class="btn"><i class="fa-solid fa-check"></i> Save Event</button>
            <button type="button" id="cancelEvent" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
</div>

<section class="completed-today-section" id="completed-today">
    <h2 class="section-heading"><i class="fa-solid fa-check-double text-green"></i> Completed Today</h2>
    <div id="completed-today-list" class="db-list"></div>
</section>

<script src="{{ url_for('static', filename='calendar.js')}}" type="module"></script>
{% endblock %}
