<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .login-page::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 3rem 2.5rem;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.6s var(--ease) forwards;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--r-md);
            background: var(--primary-dim);
            color: var(--primary-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }

        .login-card h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .login-error {
            background: var(--red-dim);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--red);
            padding: 10px 14px;
            border-radius: var(--r-sm);
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-card .form-group { margin-bottom: 1.5rem; }

        .login-card button[type="submit"] {
            width: 100%;
            padding: 12px;
            font-size: 0.925rem;
            border-radius: var(--r-sm);
        }

        .login-back {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-faint);
        }

        .login-back a {
            color: var(--text-muted);
            font-weight: 500;
        }

        .login-back a:hover { color: var(--primary-hover); }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Welcome back</h2>
            <p class="login-subtitle">Enter your password to access the planner.</p>

            {% if error %}
            <div class="login-error">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password..." autofocus>
                </div>
                <button type="submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
                </button>
            </form>
            <div class="login-back">
                <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to site</a>
            </div>
        </div>
    </div>
</body>

</html>
